[package]
name = "database-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crc = "3.4.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }

[dev-dependencies]
criterion = "0.8.2"
hdrhistogram = { version = "7.6.0", default-features = false }
tempfile = "3.27.0"

[[bench]]
name = "reads"
harness = false